events {
    worker_connections 1024;
}

http {
    # ── Upstream services ────────────────────────────────────
    upstream backend {
        server backend:3001;
    }

    upstream frontend {
        server frontend:80;
    }

    upstream ai_service {
        server ai-service:8000;
    }

    # ── Rate limiting ─────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ai:10m   rate=30r/m;

    # ── Logging ───────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Main server ───────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options       "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-XSS-Protection      "1; mode=block" always;

        client_max_body_size 20M;

        # ── Frontend (React) ──────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # ── Backend API ───────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization     $http_authorization;
            proxy_read_timeout 30s;

            # WebSocket support for Socket.IO notifications
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # ── Auth (stricter rate limit) ─────────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass       http://backend;
            proxy_set_header Host          $host;
            proxy_set_header X-Real-IP     $remote_addr;
        }

        # ── AI Service ────────────────────────────────────────
        location /ai/ {
            limit_req zone=ai burst=10 nodelay;

            rewrite ^/ai/(.*)$ /$1 break;
            proxy_pass         http://ai_service;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_read_timeout 60s;
        }

        # ── Socket.IO WebSocket ───────────────────────────────
        location /socket.io/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 60s;
        }

        # ── Health check endpoint ─────────────────────────────
        location /health {
            return 200 '{"status":"ok","service":"physioai-nginx"}';
            add_header Content-Type application/json;
        }
    }
}
